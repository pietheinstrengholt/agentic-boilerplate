[project]
name = "wine-journal-server"
version = "0.1.0"
description = "Wine Journal demo API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1.14,<2",
  "pymysql>=1.1,<2",
  "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "pyright>=1.1,<2",
]

[tool.ruff]
line-length = 88

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
